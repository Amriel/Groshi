# Перевірки запускаються для кожної зміни; підписані інсталятори — лише
# для теґів і ручного запуску. Ed25519 захищає оновлення, а не SmartScreen.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Перевірити приватність умісту коміту
        run: python scripts/privacy_check.py --staged

      - name: Перевірити захист приватності та збирання HTML
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  ui:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Установити зафіксовані залежності проб
        run: npm ci --ignore-scripts

      - name: Установити Chromium для перевірок
        run: npx --no-install playwright install --with-deps chromium

      - name: Зібрати браузерний шаблон
        run: python app/build_app.py

      - name: Зібрати десктопний шаблон
        run: python build_desktop.py
        working-directory: desktop

      - name: Перевірити захист і поведінку інтерфейсу
        run: npm test

  native:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Установити залежності перевірки нативних ресурсів
        run: npm ci --ignore-scripts

      - name: Установити Chromium
        run: npx --no-install playwright install chromium

      - name: Зібрати браузерний шаблон
        run: python app/build_app.py

      - name: Зібрати десктопний шаблон
        run: python build_desktop.py
        working-directory: desktop

      - name: Перевірити десктопний захист
        shell: pwsh
        run: |
          $env:GROSHI_CSP_FIXTURE = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/native-csp.json'
          cargo test --release --locked
        working-directory: desktop/src-tauri

      - name: Перевірити інтерфейс із політикою вбудованих ресурсів Tauri
        shell: pwsh
        run: |
          $env:GROSHI_CSP_FIXTURE = Join-Path $env:GITHUB_WORKSPACE '.test-artifacts/native-csp.json'
          node tests/desktop-csp.mjs

  # Дзеркало native для Apple Silicon (macos-latest = arm64): macOS-гілки
  # Rust і політика CSP перевіряються до того, як дійде до збірки .dmg.
  native-macos:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Установити залежності перевірки нативних ресурсів
        run: npm ci --ignore-scripts

      - name: Установити Chromium
        run: npx --no-install playwright install chromium

      - name: Зібрати браузерний шаблон
        run: python app/build_app.py

      - name: Зібрати десктопний шаблон
        run: python build_desktop.py
        working-directory: desktop

      - name: Перевірити десктопний захист
        shell: bash
        run: |
          export GROSHI_CSP_FIXTURE="$GITHUB_WORKSPACE/.test-artifacts/native-csp.json"
          cargo test --release --locked
        working-directory: desktop/src-tauri

      # desktop-csp.mjs не прив'язаний до Windows: це Playwright-проба
      # вбудованої політики CSP, тож на macOS її запускаємо без змін.
      - name: Перевірити інтерфейс із політикою вбудованих ресурсів Tauri
        shell: bash
        run: |
          export GROSHI_CSP_FIXTURE="$GITHUB_WORKSPACE/.test-artifacts/native-csp.json"
          node tests/desktop-csp.mjs

  windows:
    needs: [checks, ui, native]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Відсутній секрет має зупинити випуск до довгої збірки; його
      # вміст доступний лише цій перевірці та кроку підписування.
      - name: Перевірити наявність ключа підписування
        shell: pwsh
        env:
          GROSHI_SIGNING_KEY: ${{ secrets.GROSHI_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GROSHI_SIGNING_KEY)) {
            throw 'Не задано GROSHI_SIGNING_KEY: непідписаний інсталятор не випускається.'
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Перевірити версію теґа
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Версія теґа не збігається з версією застосунку.'
          }

      - name: Зібрати браузерний шаблон
        run: python app/build_app.py

      - name: Вставити шаблон у десктопну оболонку
        run: python build_desktop.py
        working-directory: desktop

      - name: Установити зафіксовані залежності
        run: npm ci
        working-directory: desktop

      # Ранер уже Windows: cargo-xwin тут не потрібен. Аргумент після
      # -- передається Cargo й забороняє непомітно змінювати Cargo.lock.
      - name: Зібрати інсталятор
        run: npx --no-install tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
        working-directory: desktop

      # GitHub прибирає не-ASCII з назв вкладень. Остаточне імʼя задаємо
      # перед підписуванням, щоб .exe та його .sig утворювали одну пару.
      - name: Назвати та підписати інсталятор
        shell: pwsh
        env:
          GROSHI_SIGNING_KEY: ${{ secrets.GROSHI_SIGNING_KEY }}
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundleDir = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw 'Очікувався рівно один інсталятор.'
          }
          $installerPath = Join-Path $bundleDir "Groshi_Setup_$version.exe"
          if ($installers[0].Name -ne "Groshi_Setup_$version.exe") {
            Rename-Item -LiteralPath $installers[0].FullName -NewName "Groshi_Setup_$version.exe"
          }
          node scripts/sign-update.cjs $installerPath --public-key desktop/src-tauri/update-key.pub
          if ($LASTEXITCODE -ne 0) {
            throw 'Підписування не вдалося; артефакти не публікуються.'
          }
          if (!(Test-Path -LiteralPath "$installerPath.sig" -PathType Leaf)) {
            throw 'Файл підпису не створений.'
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groshi-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  # Збірка без підпису Apple й нотаризації: застосунок ставить лише власник.
  # Ed25519-підпис .dmg потрібен лише для перевірки автооновлень.
  # Якщо dmg-бандлінг на headless-раннері впаде на AppleScript-кроці Finder,
  # запасний варіант — `--bundles app` і zip з .app (зараз не реалізовано).
  macos:
    needs: [checks, ui, native, native-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Відсутній секрет має зупинити випуск до довгої збірки.
      - name: Перевірити наявність ключа підписування
        shell: bash
        env:
          GROSHI_SIGNING_KEY: ${{ secrets.GROSHI_SIGNING_KEY }}
        run: |
          if [ -z "${GROSHI_SIGNING_KEY//[[:space:]]/}" ]; then
            echo 'Не задано GROSHI_SIGNING_KEY: непідписаний інсталятор не випускається.' >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Перевірити версію теґа
        shell: bash
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                echo 'Версія теґа не збігається з версією застосунку.' >&2
                exit 1
              fi
              ;;
          esac

      - name: Зібрати браузерний шаблон
        run: python app/build_app.py

      - name: Вставити шаблон у десктопну оболонку
        run: python build_desktop.py
        working-directory: desktop

      - name: Установити зафіксовані залежності
        run: npm ci
        working-directory: desktop

      - name: Зібрати інсталятор
        run: npx --no-install tauri build --target aarch64-apple-darwin --bundles dmg -- --locked
        working-directory: desktop

      # productName «Гроші» дає не-ASCII імʼя .dmg, яке GitHub калічить.
      # Остаточне імʼя задаємо перед підписуванням, щоб .dmg і його .sig
      # утворювали одну пару.
      - name: Назвати та підписати інсталятор
        shell: bash
        env:
          GROSHI_SIGNING_KEY: ${{ secrets.GROSHI_SIGNING_KEY }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          bundle_dir='desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg'
          shopt -s nullglob
          images=("$bundle_dir"/*.dmg)
          if [ "${#images[@]}" -ne 1 ]; then
            echo 'Очікувався рівно один .dmg.' >&2
            exit 1
          fi
          target="$bundle_dir/Groshi_${version}_aarch64.dmg"
          if [ "${images[0]}" != "$target" ]; then
            mv -- "${images[0]}" "$target"
          fi
          node scripts/sign-update.cjs "$target" --public-key desktop/src-tauri/update-key.pub
          if [ ! -f "$target.sig" ]; then
            echo 'Файл підпису не створений.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groshi-macos
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig

  # Право змінювати релізи має лише цей короткий крок після перевірок
  # і підписування; залежності та код застосунку тут не виконуються.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Імена файлів у двох артефактах різні, тож merge-multiple
      # складає їх в одну теку, а список files нижче лишається плоским.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: groshi-*
          merge-multiple: true
          path: release

      - name: Реліз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.sig
            release/*.dmg
            release/*.dmg.sig
          body: |
            Інсталятор має підпис Ed25519 для перевірки автоматичних оновлень.
            Підпис Authenticode Windows не застосовано.

            Збірка для macOS (Apple Silicon) не підписана Apple і не нотаризована,
            тому при першому запуску macOS її заблокує. Дозвольте запуск у
            «Системні налаштування → Конфіденційність і безпека → Все одно відкрити»
            або виконайте `xattr -dr com.apple.quarantine /Applications/Гроші.app`.
